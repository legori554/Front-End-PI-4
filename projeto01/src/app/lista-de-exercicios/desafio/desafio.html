<input [(ngModel)]="nome" placeholder="Digite seu nome">

<p>Disciplinas: {{disciplinas}}</p>
<button (click)="diminuir()" [disabled]="disciplinas == 1">-</button>
<button (click)="aumentar()">+</button>

<br><br>
<button (click)="mensagem()" [disabled]="nome == '' ">Realizar Matricula </button>
<p>{{recado}}</p>
