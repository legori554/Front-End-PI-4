<p>Produto: {{produto}}</p>
<p>Preço: {{preco | currency:'BRL'}}</p>

<p>Quantidade: {{quantidade}}</p>
<button (click)="diminuir()" [disabled]="quantidade == 1">-</button>
<button (click)="aumentar()">+</button>

<p>Total: {{total | currency:'BRL'}}</p>

<button (click)="mensagem()">Adicionar ao Carrinho</button>
<p>{{recado}}</p>
